<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="KKCoder logo variant 2 Terminal Prompt">
  <defs>
    <linearGradient id="v2-bg" x1="80" y1="48" x2="420" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#121820"/>
      <stop offset="100%" stop-color="#070a0f"/>
    </linearGradient>
    <linearGradient id="v2-accent" x1="120" y1="140" x2="400" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="v2-kk" x1="180" y1="160" x2="400" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#v2-bg)"/>
  <!-- Terminal window chrome -->
  <rect x="88" y="112" width="336" height="288" rx="36" fill="#0b1220" stroke="#1e293b" stroke-width="4"/>
  <circle cx="128" cy="148" r="10" fill="#ef4444" opacity="0.9"/>
  <circle cx="158" cy="148" r="10" fill="#f59e0b" opacity="0.9"/>
  <circle cx="188" cy="148" r="10" fill="#22c55e" opacity="0.9"/>
  <!-- Prompt chevron -->
  <path d="M128 248l42 36-42 36" fill="none" stroke="url(#v2-accent)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- KK as command text -->
  <g fill="url(#v2-kk)">
    <path d="M214 200h28v52l42-52h34l-50 60 52 72h-34l-44-62v62h-28V200z"/>
    <path d="M320 200h28v52l42-52h34l-50 60 52 72h-34l-44-62v62h-28V200z"/>
  </g>
  <!-- Cursor block -->
  <rect x="414" y="308" width="18" height="36" rx="4" fill="#10b981">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/>
  </rect>
</svg>
